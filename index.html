<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Transmission</title>
<style>
  :root {
    --bg: #0a0e17;
    --bg-2: #0d1220;
    --surface: #10151f;
    --border: #1e2536;
    --text: #ece9e2;
    --text-dim: #6b7488;
    --accent: #4fd1c5;
    --accent-dim: rgba(79, 209, 197, 0.35);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(79, 209, 197, 0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(79, 209, 197, 0.04), transparent 45%),
      repeating-linear-gradient(
        transparent,
        transparent 3px,
        rgba(255, 255, 255, 0.008) 3px,
        rgba(255, 255, 255, 0.008) 4px
      );
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 640px;
    padding: 48px 44px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  /* Corner brackets — the signature element: a viewfinder/monitor readout */
  .frame::before,
  .frame::after,
  .corner-tl,
  .corner-br {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
  }
  .frame::before {
    top: -1px; left: -1px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .frame::after {
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }
  .corner-tl {
    top: -1px; right: -1px;
    border-top: 2px solid var(--border);
    border-right: 2px solid var(--border);
  }
  .corner-br {
    bottom: -1px; left: -1px;
    border-bottom: 2px solid var(--border);
    border-left: 2px solid var(--border);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-dim);
    animation: pulse 2.2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--accent-dim); }
    70%  { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.9rem, 4.5vw, 2.7rem);
    line-height: 1.2;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
    transition: opacity 0.4s ease;
  }

  p#content {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--text);
    opacity: 0.92;
    margin: 0 0 36px;
    white-space: pre-wrap;
    transition: opacity 0.4s ease;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .fade {
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    h1, p#content { transition: none; }
  }

  @media (max-width: 480px) {
    .frame { padding: 36px 24px 24px; }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <div class="eyebrow">
      <span class="dot"></span>
      <span>Live · updated from Telegram</span>
    </div>

    <h1 id="title">Loading…</h1>
    <p id="content"></p>

    <div class="footer">
      <span id="updated">—</span>
      <span id="countdown">refreshing in 5:00</span>
    </div>
  </div>

  <script>
    const REFRESH_MS = 5 * 60 * 1000; // 5 minutes
    let secondsLeft = REFRESH_MS / 1000;

    const titleEl = document.getElementById('title');
    const contentEl = document.getElementById('content');
    const updatedEl = document.getElementById('updated');
    const countdownEl = document.getElementById('countdown');

    function formatCountdown(s) {
      const m = Math.floor(s / 60);
      const sec = String(s % 60).padStart(2, '0');
      return `refreshing in ${m}:${sec}`;
    }

    function formatUpdated(iso) {
      if (!iso) return 'not yet updated';
      const d = new Date(iso);
      return `updated ${d.toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      })}`;
    }

    async function loadContent() {
      try {
        const res = await fetch('/api/content', { cache: 'no-store' });
        const data = await res.json();

        titleEl.classList.add('fade');
        contentEl.classList.add('fade');

        setTimeout(() => {
          titleEl.textContent = data.title || 'Hello, World!';
          contentEl.textContent = data.content || '';
          updatedEl.textContent = formatUpdated(data.updatedAt);
          titleEl.classList.remove('fade');
          contentEl.classList.remove('fade');
        }, 200);
      } catch (err) {
        console.error('Failed to load content', err);
      }
    }

    function tickCountdown() {
      secondsLeft -= 1;
      if (secondsLeft <= 0) {
        secondsLeft = REFRESH_MS / 1000;
        loadContent();
      }
      countdownEl.textContent = formatCountdown(secondsLeft);
    }

    loadContent();
    setInterval(tickCountdown, 1000);
  </script>

</body>
</html>
